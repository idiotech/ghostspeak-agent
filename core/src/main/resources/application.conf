fcm {
  key-file = "/Users/hmchang/Downloads/fcm.json"
  key-file = ${?FCM_KEY_FILE}
}

pekko {

  logger-startup-timeout = 30s

  actor {
    # Set this to on to enable serialization-bindings defined in
    # additional-serialization-bindings. Those are by default not included
    # for backwards compatibility reasons. They are enabled by default if
    # akka.remote.artery.enabled=on.
    enable-additional-serialization-bindings = on

    allow-java-serialization = off
  }

  persistence {
    # Pekko's default is 50. A recovery uses one connection at a time (snapshot load, then
    # replay), so allowing more recoveries than the shared pool has connections only queues them
    # in Slick. MAX_CONCURRENT_RECOVERIES overrides this, e.g. to cap recoveries below the pool
    # size and leave connections free for live traffic.
    max-concurrent-recoveries = ${slick.db.numThreads}
    max-concurrent-recoveries = ${?MAX_CONCURRENT_RECOVERIES}
    journal {
      plugin = "jdbc-journal"
      auto-start-journals = ["jdbc-journal"]
    }
    snapshot-store {
      plugin = "jdbc-snapshot-store"
      auto-start-snapshot-stores = ["jdbc-snapshot-store"]
    }
  }
}

# The journal, snapshot store and read journal share one Slick database (one connection pool).
# Without this each plugin would build its own pool from ${slick}, tripling the connections.
pekko-persistence-jdbc.shared-databases.slick = ${slick}

jdbc-journal {
  use-shared-db = "slick"
}

jdbc-snapshot-store {
  use-shared-db = "slick"
  # A snapshot that cannot be loaded (for example a user-scenario snapshot written before
  # variables and strings were stored, which no longer decodes) is skipped, and the actor
  # recovers by replaying its whole journal instead. This is only safe because events are
  # never deleted on snapshot; do not combine it with withDeleteEventsOnSnapshot.
  snapshot-is-optional = true
}

jdbc-read-journal {
  use-shared-db = "slick"
}

slick {
  profile = "slick.jdbc.MySQLProfile$"
  db {
    host = ${?MYSQL_HOST}
    url = "jdbc:mysql://"${?MYSQL_HOST}":"${?MYSQL_PORT}"/"${?MYSQL_JOURNAL_DB}"?cachePrepStmts=true&cacheCallableStmts=true&cacheServerConfiguration=true&useLocalSessionState=true&elideSetAutoCommits=true&alwaysSendSetIsolation=false&enableQueryTimeouts=false&connectionAttributes=none&verifyServerCertificate=false&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&useLegacyDatetimeCode=false&serverTimezone=UTC&rewriteBatchedStatements=true"
    user = ${?MYSQL_USER}
    password = ${?MYSQL_PASSWORD}
    driver = "com.mysql.cj.jdbc.Driver"
    # The one pool shared by all persistence plugins: at most this many MySQL connections per
    # server instance (plus PerformanceLogger's own pool). Check it against MySQL max_connections
    # times the number of instances, including old and new pods overlapping during a deploy.
    numThreads = 20
    numThreads = ${?MYSQL_POOL_SIZE}
    maxConnections = ${slick.db.numThreads}
    minConnections = 1
  }
}

pekko-http-cors {
  allow-generic-http-requests = yes
  allow-credentials = yes
  allowed-origins = "*"
  allowed-headers = "*"
  allowed-methods = ["GET", "POST", "HEAD", "OPTIONS", "PUT", "DELETE"]
  exposed-headers = []
  max-age = 1800 seconds
}
logger.scala.slick=INFO

app {
  corsDomains = ""
  corsDomains = ${?CORS_DOMAINS}
}