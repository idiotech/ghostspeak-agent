version = 3.11.5

runner.dialect = scala3

preset = defaultWithAlign
maxColumn = 100

align.openParenCallSite = false
align.openParenDefnSite = false
align.tokens = [{code = "->"}, {code = "<-"}, {code = "=>", owners = [{regex = "Case"}]}]
indent.callSite = 2
indent.defnSite = 2
danglingParentheses.preset = true
indentOperator.preset = spray
indentOperator.exemptScope = oldTopLevel
includeNoParensInSelectChains = false
# as in 2.7.5: a blank line before multi-line definitions, not before multi-line expressions
newlines.topLevelStatementBlankLines = [{ minBreaks = 1, regex = "^Defn\\.", blanks { before = 1 } }]
newlines.alwaysBeforeElseAfterCurlyIf = false
project.excludeFilters = [".*\\.sbt", ".*/src_managed/.*"]
rewrite.rules = [RedundantParens, RedundantBraces, Imports]
# third-party, then this project, then java/scala; selectors sorted
rewrite.imports.sort = scalastyle
rewrite.imports.groups = [
  ["(?!javax?\\.|scala\\.|tw\\.idv\\.idiotech\\.).*"],
  ["tw\\.idv\\.idiotech\\..*"],
  ["javax?\\..*", "scala\\..*"]
]
# Scala 3 syntax: * imports, `as` renames, ? wildcards; keep braces and if (...) parentheses
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.newSyntax.control = false
rewrite.redundantBraces.stringInterpolation = true
rewrite.redundantBraces.parensForOneLineApply = true
rewrite.redundantBraces.generalExpressions = false
rewrite.redundantBraces.ifElseExpressions = false
rewrite.trailingCommas.style = never
spaces.inImportCurlyBraces = true
